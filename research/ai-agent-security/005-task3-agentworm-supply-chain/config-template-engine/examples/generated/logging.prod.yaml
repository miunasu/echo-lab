version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  json:
    format: '{"time":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","message":"%(message)s"}'
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: /var/log/demo-service/demo-service.log
    maxBytes: 52428800
    backupCount: 10
    encoding: utf-8
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: standard
    filename: /var/log/demo-service/demo-service.error.log
    maxBytes: 52428800
    backupCount: 10
    encoding: utf-8
root:
  level: INFO
  handlers:
  - console
  - file
  - error_file
loggers:
  urllib3:
    level: WARNING
    propagate: true
  sqlalchemy.engine:
    level: WARNING
    propagate: true
