database:
  engine: postgresql
  host: localhost
  port: 5432
  name: demo_dev
  user: demo
  password: dev-secret
  options:
    charset: utf8mb4
    timezone: UTC
    ssl_mode: prefer
pool:
  min_size: 1
  max_size: 5
  max_overflow: 5
  pool_timeout: 30
  recycle: 1800
  pre_ping: true
migrations:
  auto_migrate: true
  scripts_path: migrations
redis:
  enabled: true
  host: localhost
  port: 6379
  db: 0
  password: ''
  ssl: false
environments:
  current: dev
  debug_sql: true
