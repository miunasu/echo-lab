[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "config-template-engine"
version = "1.0.0"
description = "Universal config file template engine supporting YAML / Markdown / JSON"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
cte = "config_engine.cli:main"
config-template-engine = "config_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["config_engine*"]