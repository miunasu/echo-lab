entry_points = [
    { name = "flag-demo", module = "flag_demo.cli", attr = "main" },
]

[package]
name = "flag_demo"
version = "0.3.0"
author = "Spore"
author_email = ""
description = "flag_demo - generated by py-package-builder"
license = "MIT"
python_requires = ">=3.8"
dependencies = [
    "requests>=2.0",
]
package_dir = "."
keywords = [
    "python",
    "package",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
use_pyproject = true
use_setup_py = true
include_readme = true
include_license = true

[[modules]]
name = "core"
content = "\"\"\"Core logic for flag_demo.\"\"\"\n\ndef hello(name: str = \"world\") -> str:\n    return f\"Hello, {name}!\"\n"

[[modules]]
name = "utils"
content = "\"\"\"utils module for flag_demo.\"\"\"\n"

[optional_dependencies]

