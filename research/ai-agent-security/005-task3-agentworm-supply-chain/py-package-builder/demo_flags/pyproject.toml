[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flag_demo"
version = "0.3.0"
description = "flag_demo - generated by py-package-builder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "Spore"},
]
keywords = ["python", "package"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.0",
]

[project.scripts]
flag-demo = "flag_demo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flag_demo*"]
