[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adi-toolkit"
version = "1.0.0"
description = "Agent Data Injection (ADI) Red Team Testing Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ADI Red Team" }]
keywords = ["adi", "agent", "injection", "red-team", "security", "llm"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
adi-toolkit = "adi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]